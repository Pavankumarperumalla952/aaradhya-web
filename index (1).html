<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GUMASTHA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f5f7;--card:#ffffff;--text:#1f2430;--muted:#6b7280;--accent:#3b5bdb;--line:#e3e6ec}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  html{background:var(--bg)}
  body{color:var(--text);font-family:"Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
  header{padding:14px 18px;display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line)}
  .logo{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1.2rem;font-weight:600;color:#fff;background:var(--accent)}
  h1{font-size:1.1rem;font-weight:600}
  header p{font-size:.8rem;color:var(--muted)}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:10px 14px;border-radius:14px;line-height:1.6;font-size:1rem;white-space:pre-wrap;overflow-wrap:anywhere}
  .bot{background:var(--card);border:1px solid var(--line);align-self:flex-start}
  .me{background:var(--accent);color:#fff;align-self:flex-end}
  .err{background:#fdecec;border-color:#f3c4c4;color:#9b2c2c}
  form{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
  input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:10px 16px;font:inherit;font-size:1rem}
  input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{border:0;border-radius:20px;padding:0 18px;font:inherit;font-weight:500;cursor:pointer;background:var(--accent);color:#fff}
  button.mic{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:0 12px}
  button.mic.on{background:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  @media (prefers-reduced-motion:no-preference){.typing{animation:p 1.2s infinite}@keyframes p{50%{opacity:.5}}}
</style>
</head>
<body>
<header><div class="logo">గు</div><div><h1>GUMASTHA</h1><p>AI assistant · Telugu & English</p></div></header>
<div id="chat"><div class="msg bot">నమస్తే! నేను గుమస్తా. ఏం కావాలో అడగండి.</div></div>
<form id="f">
  <button type="button" class="mic" id="mic" aria-label="Speak">🎤</button>
  <input id="q" autocomplete="off" placeholder="Type a message…" aria-label="Message">
  <button id="send">Send</button>
</form>
<script>
const API_URL = "https://aaradhya-backend.vercel.app/chat";
const chat = document.getElementById("chat"), f = document.getElementById("f"),
      q = document.getElementById("q"), send = document.getElementById("send"), mic = document.getElementById("mic");

function add(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}

f.addEventListener("submit", async e => {
  e.preventDefault();
  const message = q.value.trim();
  if(!message) return;
  add(message, "me"); q.value = ""; send.disabled = true;
  const wait = add("ఆలోచిస్తున్నాను…", "bot typing");
  try{
    const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message})});
    const data = await r.json();
    wait.remove();
    if(!r.ok) throw new Error(data.details || data.error || "Server error");
    add(data.reply, "bot");
  }catch(err){
    wait.remove();
    add("Reply raaledu: " + err.message + ". Konchem sepu tarvata malli try cheyyandi.", "bot err");
  }
  send.disabled = false; q.focus();
});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ mic.style.display = "none"; }
else{
  const rec = new SR(); rec.lang = "te-IN"; rec.interimResults = false;
  rec.onresult = ev => { q.value = ev.results[0][0].transcript; f.requestSubmit(); };
  rec.onend = () => mic.classList.remove("on");
  mic.addEventListener("click", () => { mic.classList.add("on"); rec.start(); });
}
</script>
</body>
</html>
